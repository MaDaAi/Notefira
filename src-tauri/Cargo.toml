[package]
name = "notefira"
version = "0.1.0"
description = "Offline-first handwriting, PDF annotation and study notebooks"
authors = ["Notefira contributors"]
edition = "2021"

[lib]
name = "notefira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2"
webbrowser = "1"

