name: Bug report
description: Something in Notefira isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem!

        **Please don't post private information.** Issues are public. Don't attach notebooks, screenshots or logs that show personal notes, names, email addresses or anything else you wouldn't want the whole internet to see.

        **Security problems** must not be reported here — use [private vulnerability reporting](https://github.com/MaDaAi/Notefira/security/advisories/new) instead.
        **Questions and "how do I…?"** belong in [Discussions](https://github.com/MaDaAi/Notefira/discussions).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: When I erase part of a pencil stroke, the rest of the stroke disappears too.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that make the problem happen.
      placeholder: |
        1. Create a notebook
        2. Draw with the Pencil
        3. Switch to the eraser (Precise) and erase the middle
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where are you using Notefira?
      options:
        - Web app in a browser
        - Installed web app (PWA)
        - Windows desktop app
        - macOS desktop app
        - Linux desktop app
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / operating system and version
      placeholder: Chrome 131 on Windows 11, Safari on iPadOS 18, …
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input device (if relevant)
      options:
        - Not relevant
        - Mouse / trackpad
        - Touch screen
        - Stylus / pen
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic log (optional)
      description: In Notefira, open Help → Export diagnostic log. Please read it first and remove anything private before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find this problem.
          required: true
        - label: I removed any private or personal information from this report.
          required: true
