# Builds Notefira and publishes it to GitHub Pages on every push to the main branch.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional Google Drive sync: Settings → Secrets and variables → Actions → Variables →
#   VITE_GOOGLE_CLIENT_ID = your OAuth "Web application" client ID (client IDs are not secret).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Refuse to publish with placeholder links
        run: |
          if grep -rIl "NOTEFIRA_GITHUB_REPO" dist . --exclude-dir=node_modules --exclude-dir=.git --exclude=deploy-pages.yml; then
            echo "::error::Replace NOTEFIRA_GITHUB_REPO with the repository's owner/name in the files listed above before publishing."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
