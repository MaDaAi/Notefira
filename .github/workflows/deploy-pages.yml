# Builds Notefira and publishes it to GitHub Pages on every push to the main branch.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Google Drive sync: Settings → Secrets and variables → Actions → Variables →
#   VITE_GOOGLE_CLIENT_ID = Notefira's OAuth "Web application" client ID (client IDs are not secret;
#                           never add a client secret anywhere).
#   VITE_GOOGLE_SIGNIN    = "public" to show "Continue with Google" to everyone. Leave it unset while the
#                           Google app is in Testing: the button then appears only in browsers opened
#                           once with ?google-test=on (and Google lets only the listed test users in).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SIGNIN: ${{ vars.VITE_GOOGLE_SIGNIN }}
      - name: Refuse to publish with placeholder links
        run: |
          if grep -rIl "NOTEFIRA_GITHUB_REPO" dist . --exclude-dir=node_modules --exclude-dir=.git --exclude=deploy-pages.yml; then
            echo "::error::Replace NOTEFIRA_GITHUB_REPO with the repository's owner/name in the files listed above before publishing."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
